function submitPage(){const p=el("section","panel");p.append(el("div","eyebrow","SAVE POINT"),el("h1","","Сдать работу"),el("p","",count()+" из "+TASKS.length+" ответов заполнено."),el("p","muted","Файл включает все письменные ответы, дату и номер попытки. Аудио нужно отправить отдельно. Скачивание не означает отправку учителю."));const row=el("div","row");row.append(button("Скачать ответы для Татьяны",exportAnswers,"primary"),button("Восстановить ответы из файла",()=>document.getElementById("restoreInput").click()));p.append(row);const input=el("input");input.type="file";input.accept=".json,application/json";input.id="restoreInput";input.className="hidden";input.onchange=()=>restore(input.files[0]);p.append(input);const status=el("div","note");status.id="submissionStatus";p.append(status);p.append(el("h2","","Перед отправкой"),el("p","","1. Прикрепи скачанный файл .json в чате с Татьяной.\n2. Прикрепи аудиозапись Speaking.\n3. Дождись проверки и загрузи файл комментариев в «Проверка учителя»."));main.append(p);renderSubmissionStatus();}
function renderSubmissionStatus(){const e=document.getElementById("submissionStatus");if(e)e.textContent=state.lastSubmission?"Последний скачанный файл: "+state.lastSubmission.submissionId+". Ответы, изменённые после скачивания, попадут только в новый файл.":"Файл ответов ещё не скачан.";}
async function readFile(file){if(!file)throw Error("Выбери файл.");if(file.size>2000000)throw Error("Файл слишком большой.");return JSON.parse(await file.text());}
function validAnswers(a){if(!a||Array.isArray(a)||typeof a!=="object")return false;return Object.entries(a).every(([id,v])=>TASKS.some(t=>t.id===id)&&typeof v==="string"&&v.length<=6000);}
async function restore(file){try{const s=await readFile(file);if(s.app!=="timofey-homework"||s.schema!==1||s.quest!==QUEST||!validAnswers(s.answers))throw Error("Это не файл ответов этой миссии.");const dialog=el("dialog");dialog.append(el("h2","","Восстановить ответы?"),el("p","","Текущие ответы на этом устройстве будут заменены содержимым выбранного файла."),button("Заменить",()=>{state.answers=s.answers;state.lastSubmission=s;state.feedback=null;save();dialog.close();dialog.remove();open("Home");toast("Ответы восстановлены.");},"primary"),button("Отмена",()=>{dialog.close();dialog.remove();}));document.body.append(dialog);dialog.showModal();}catch(e){toast(e.message||"Не удалось открыть файл.");}}

async function importFeedback(file){try{const f=await readFile(file);if(f.app!=="timofey-feedback"||f.schema!==1||f.quest!==QUEST||!Array.isArray(f.items)||f.items.length!==TASKS.length||!f.items.every((x,i)=>x.id===TASKS[i].id&&Number.isFinite(x.score)&&x.score>=0&&x.score<=TASKS[i].max&&typeof x.comment==="string"&&x.comment.length<=6000)||typeof f.general!=="string"||f.general.length>10000)throw Error("Неверный файл проверки.");if(!state.lastSubmission||f.submissionId!==state.lastSubmission.submissionId)throw Error("Проверка относится к другой попытке. Сначала восстанови соответствующий файл ответов в «Сдать работу».");state.feedback=f;save();drawFeedback();toast("Комментарии Татьяны загружены.");}catch(e){toast(e.message||"Ошибка загрузки.");}}
function drawFeedback(){const b=document.getElementById("feedback");if(!b)return;b.replaceChildren();const f=state.feedback;if(!f){b.append(el("p","note","Проверки ещё нет. Ответы на этом устройстве остаются сохранёнными."));return;}const sum=f.items.reduce((n,x)=>n+x.score,0),max=TASKS.reduce((n,t)=>n+t.max,0);b.append(el("h2","",sum+" / "+max+" учебных баллов"),el("p","muted","Попытка: "+f.submissionId),el("p","answer",f.general));f.items.forEach(x=>{const t=TASKS.find(t=>t.id===x.id),q=el("div","reviewitem");q.append(el("h3","",t.section+" • "+t.prompt),el("p","",x.score+" / "+t.max),el("p","answer",state.lastSubmission.answers[t.id]||"Нет ответа"),el("p","",x.comment||"Без комментария"));b.append(q);});}
function audioPanel(){const p=el("section","panel");p.append(el("h2","","Аудиоответы"),el("p","muted","Назови номер каждого вопроса и запиши все шесть ответов одним файлом. Скачай запись и отправь её вместе с письменными ответами. Запись автоматически не сохраняется."));
const row=el("div","row"),start=button("Начать запись",async()=>{try{if(!navigator.mediaDevices||!window.MediaRecorder)throw Error("Запись здесь недоступна. Запиши аудио в диктофоне и отправь Татьяне.");start.disabled=true;stream=await navigator.mediaDevices.getUserMedia({audio:true});media=new MediaRecorder(stream);chunks=[];media.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};media.onstop=()=>{stream.getTracks().forEach(t=>t.stop());if(recordURL)URL.revokeObjectURL(recordURL);const blob=new Blob(chunks,{type:media.mimeType});recordURL=URL.createObjectURL(blob);player.src=recordURL;player.classList.remove("hidden");const ext=media.mimeType.includes("mp4")?"m4a":media.mimeType.includes("ogg")?"ogg":"webm";state.audioName="Timofey-Speaking-"+Date.now()+"."+ext;save();dl.href=recordURL;dl.download=state.audioName;dl.classList.remove("hidden");status.textContent="Запись готова. Обязательно скачай файл.";start.disabled=false;stop.disabled=true;};media.start();stop.disabled=false;status.textContent="Идёт запись. Ответь на шесть вопросов и нажми «Остановить»."; }catch(e){start.disabled=false;if(stream)stream.getTracks().forEach(t=>t.stop());toast(e.message||"Нет доступа к микрофону. Используй диктофон.");}},"primary"),stop=button("Остановить",()=>{if(media&&media.state==="recording")media.stop();});stop.disabled=true;row.append(start,stop);p.append(row);const status=el("p","status","Можно использовать диктофон телефона, если микрофон в браузере недоступен.");p.append(status);const player=el("audio","hidden");player.controls=true;const dl=el("a","button hidden","Скачать аудио");p.append(player,dl);main.append(p);if(recordURL){player.src=recordURL;player.classList.remove("hidden");dl.href=recordURL;dl.download=state.audioName;dl.classList.remove("hidden");}}
