const readingSets=[{title:"A Robot That Learned to Sort Rubbish",text:article,q:questions},{"title":"The Glasses That Could Translate Conversations","text":"At a technology fair in Manchester, seventeen-year-old Mia tried a pair of smart glasses that displayed translations directly in front of her eyes. The device used a small microphone to recognise speech and showed a short line of text inside the lens. Mia was studying Spanish, so she tested the glasses by asking a visitor from Madrid for directions.\n\nThe first answer appeared almost immediately, but it contained a mistake. The device translated the Spanish word for 'bank' as a place to keep money, although the visitor was talking about the side of a river. The developer explained that the software sometimes struggled when a word had several meanings.\n\nThe company had originally designed the glasses for tourists. Later, a local museum asked whether the system could help international visitors understand guided tours. The team created a special version that recognised common museum vocabulary. It was tested by fifteen volunteers, who generally found it useful in quiet rooms. In crowded spaces, however, background conversations often confused the microphone.\n\nMia liked the idea but noticed that the glasses needed to connect to a phone. Without that connection, the translation function stopped working. She also wondered whether it would be polite to record strangers' words without their knowledge. The developer said that the next model would show a visible sign whenever its microphone was active.\n\nAt the end of the fair, Mia decided not to order the glasses. She felt that they could be helpful on a trip, but she wanted to improve her own language skills rather than depend on a screen for every conversation.","q":[["Mia tried the smart glasses at a technology fair in Manchester.","True"],["The glasses translated every word correctly during Mia's test.","False"],["The glasses were first developed for museum guides.","False"],["Fifteen volunteers tested a museum version of the device.","True"],["The device performed best in crowded and noisy places.","False"],["Mia had already visited Madrid before attending the fair.","Not stated"],["The translation function required a phone connection.","True"],["Mia decided to buy a pair of the glasses immediately.","False"]]},{"title":"The Quietest Competition in Seoul","text":"On a warm Saturday afternoon, a group of people gathered in a park in Seoul for an unusual competition. Instead of running or solving puzzles, they were asked to sit quietly for ninety minutes. They could not use their phones, talk to one another or fall asleep.\n\nThe event was inspired by artist Woops Yang, who had experienced a stressful period and began thinking about the pressure to stay busy. She wanted to create an activity in which doing nothing was considered a skill. The early competitions were small, but interest gradually spread and similar events appeared outside South Korea.\n\nAt the event, participants wore heart-rate monitors. Organisers collected the measurements at regular intervals to see how calmly people were sitting. Spectators also watched the competitors and voted for the person they found most convincing. The organisers combined the audience's votes with the measurements to select a winner.\n\nOne participant, a university student called Joon, admitted that the first twenty minutes were surprisingly difficult. He kept thinking about unfinished assignments and wanted to check his phone. After a while, he began to notice sounds from the park that he would normally ignore. He did not win, but said he would try short screen-free breaks while studying.\n\nHealth specialists interviewed by a local newspaper welcomed the idea of taking breaks, but warned that sitting still for ninety minutes was not a replacement for regular sleep or exercise. The event was intended as a public reminder of the value of rest, not as a medical treatment.","q":[["Competitors had to remain quiet for an hour and a half.","True"],["Participants were permitted to check their phones once.","False"],["Woops Yang developed the idea after a period of stress.","True"],["The first event was held in the morning.","Not stated"],["The winner was selected using only audience votes.","False"],["Joon won the competition on his first attempt.","False"],["Joon planned to introduce short breaks without screens.","True"],["Health specialists claimed the competition could replace sleep.","False"]]},{"title":"How a School Built a Tiny Satellite","text":"Students at a secondary school in Bristol spent eight months building a small satellite for a national engineering challenge. Their goal was not to send a spacecraft into orbit. Instead, the satellite would be carried by a balloon to a high altitude, where it would measure air temperature and pressure before returning to the ground.\n\nThe team consisted of six students aged between fourteen and seventeen. Their physics teacher supervised the project, but the teenagers had to make the main technical decisions themselves. They used a low-cost computer, several sensors and a lightweight plastic case made with the school's 3D printer.\n\nThe first test was disappointing. During a short flight, the battery disconnected and the computer failed to save any measurements. The students considered buying a more expensive battery, but their teacher suggested inspecting the connector first. They discovered that it had become loose because of vibration. After securing it, they completed three successful ground tests.\n\nThe final launch took place on a clear morning in May. The balloon rose for almost two hours, and a GPS tracker allowed the team to locate the equipment after it landed in a field. The students recovered most of their data, although one pressure sensor produced unreliable readings near the highest point.\n\nTheir project did not receive the top prize. Nevertheless, the organisers praised the
