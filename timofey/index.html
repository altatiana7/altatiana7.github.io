<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Timofey's English Hub</title>
<style>
:root{
  --bg:#cdd6dc; --card:#edf1f3; --card2:#dde4e8; --ink:#1d2932; --muted:#566673; --line:#b3c0c9; --steel:#44637d;
  --accent:#41705f;
  --serif:Georgia,"Times New Roman",Times,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font-family:var(--serif);background:var(--bg)}
button{font:inherit;color:inherit}

/* left column + work area */
.app{height:100vh;display:grid;grid-template-columns:290px minmax(0,1fr)}
.side{min-height:0;display:flex;flex-direction:column;gap:12px;padding:14px;background:var(--card);border-right:1px solid var(--line);overflow:auto}
.photo{flex:0 1 auto;width:100%;height:240px;min-height:120px;object-fit:cover;object-position:50% 0;border-radius:8px;border:1px solid var(--line);display:block;filter:saturate(.88)}
h1{margin:2px 0 0;font-size:24px;font-weight:800;line-height:1.15}
.meta{font-size:17px;color:var(--muted)}
.meta b{color:var(--accent)}
.nav{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.go{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:56px;padding:0 16px;border:1px solid var(--line);border-radius:8px;background:var(--card2);
  font-size:19px;font-weight:800;cursor:pointer;text-align:left;white-space:nowrap
}
.go span{color:var(--muted);font-weight:400}
.go:hover{border-color:var(--accent);color:var(--accent)}
.go.active{background:var(--steel);border-color:var(--steel);color:#fff}
.go.active span{color:#c9d6df}

.work{min-width:0;min-height:0}
.work iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-height:600px){.photo{height:200px}}
@media(max-width:760px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .photo{height:260px;width:auto;max-width:100%;aspect-ratio:285/400;align-self:flex-start}
  .work iframe{height:90vh}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <img class="photo" src="./timofey.jpg?v=20261007" alt="Timofey">
    <div>
      <h1>Timofey's English Hub</h1>
      <div class="meta">grade <b>9</b> · goal <b>OGE</b></div>
    </div>
    <nav class="nav">
      <button class="go" type="button" data-open="homework">On Screen Homework<span>›</span></button>
      <button class="go" type="button" data-open="oge">OGE Homework<span>›</span></button>
    </nav>
  </aside>
  <main class="work" id="work"></main>
</div>

<script>
(()=>{
  const PAGES={
    homework:['On Screen Homework','../timofey-homework/?v=20261112b'],
    oge:['OGE Homework','../timofey-oge-homework/?v=20261112c']
  };
  const work=document.getElementById('work');
  const btns=[...document.querySelectorAll('[data-open]')];
  function openPage(key){
    const p=PAGES[key];if(!p)return;
    btns.forEach(b=>b.classList.toggle('active',b.dataset.open===key));
    work.innerHTML='';
    const f=document.createElement('iframe');f.title=p[0];f.src=p[1];
    /* inner pages have their own link back to this hub — not needed here */
    f.addEventListener('load',()=>{try{f.contentDocument.querySelectorAll('a[href="../timofey/"]').forEach(a=>a.style.display='none');}catch(e){}});
    work.appendChild(f);
    history.replaceState(null,'','#'+key);
  }
  btns.forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.open)));
  const h=location.hash.slice(1);
  openPage(PAGES[h]?h:/^oge/.test(h)?'oge':'homework');
})();
</script>
</body>
</html>
