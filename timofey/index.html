<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OGE interactive · Timofey</title>
<style>
/* Design: Tatyana's "OGE interactive" cover (cover-oge.webp). The photo is the left part of that picture;
   title and buttons are real HTML on the right. */
:root{
  --bg:#ecebf3; --ink:#0f1230; --muted:#5a5c78; --violet:#4b2fc4; --violet2:#3a22a3; --lav:#b9a3f7; --line:#d9d2f3;
  --sans:"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:linear-gradient(110deg,#f1f0f6 0%,var(--bg) 60%,#e6e3f2 100%)}
button{font:inherit;color:inherit}

.hub{height:100vh;display:grid;grid-template-columns:auto minmax(0,1fr);overflow:hidden}
.photo{height:100%;aspect-ratio:700/941;max-width:52vw;
  background:url("./cover-oge.webp?v=20261112") left center/auto 100% no-repeat;
  -webkit-mask-image:linear-gradient(90deg,#000 62%,transparent 98%);mask-image:linear-gradient(90deg,#000 62%,transparent 98%)}
.right{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;gap:clamp(18px,4.5vh,40px);padding:24px clamp(20px,3.5vw,56px) 24px 0}

h1{margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:.25em;font-size:clamp(40px,6vw,86px);font-weight:900;line-height:1;letter-spacing:-.02em}
h1 em{font-style:italic;font-weight:800;background:var(--lav);border-radius:.32em;padding:.06em .32em .12em;letter-spacing:-.01em}

.btns{display:flex;flex-direction:column;gap:clamp(10px,2.2vh,20px);width:min(600px,100%)}
.go{display:flex;align-items:center;gap:22px;min-height:clamp(70px,13vh,104px);padding:10px 26px;
  border:2px solid #fff;border-radius:22px;cursor:pointer;text-align:left;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(240,236,252,.92));
  box-shadow:0 10px 26px rgba(75,47,196,.10),inset 0 0 0 1px var(--line);transition:transform .12s,box-shadow .12s}
.go:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(75,47,196,.18),inset 0 0 0 1px var(--lav)}
.go:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.go svg.ic{flex:0 0 auto;width:clamp(46px,8.5vh,64px);height:clamp(46px,8.5vh,64px);fill:none;stroke:var(--violet);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.go svg.ic .f{fill:#cbbcf8;stroke:var(--violet)}
.go b{flex:1;font-size:clamp(22px,3vw,34px);font-weight:800;line-height:1.1;color:var(--ink)}
.go svg.ar{flex:0 0 auto;width:34px;height:34px;fill:none;stroke:var(--violet);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* screen with the chosen section */
.screen{position:fixed;inset:0;z-index:30;display:none;background:#eef0f6}
.screen.open{display:grid;grid-template-rows:42px 1fr}
.head{display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(90deg,var(--violet2),#6a4ee0);color:#fff}
.back{border:0;border-radius:8px;background:#fff;color:var(--ink);font-weight:800;font-size:15px;padding:5px 12px;cursor:pointer}
.ttl{font-size:17px;font-weight:800}
.ws{min-height:0}
.ws iframe{width:100%;height:100%;border:0;display:block}

@media(max-width:800px){
  html,body{height:auto}
  .hub{height:auto;grid-template-columns:1fr}
  .photo{height:340px;width:auto;max-width:100%;aspect-ratio:700/941;margin:0 auto;background-size:auto 100%;background-position:left center;
    -webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}
  .right{padding:8px 16px 24px;margin-left:0}
  .go{gap:14px;padding:10px 16px}
}
@media(prefers-reduced-motion:reduce){.go{transition:none}}
</style>
</head>
<body>
<main class="hub">
  <div class="photo" role="img" aria-label="Timofey"></div>
  <section class="right">
    <h1>OGE <em>interactive</em></h1>
    <div class="btns">
      <button class="go" type="button" data-open="oge">
        <svg class="ic" viewBox="0 0 48 48"><path class="f" d="M12 5h17l9 9v27a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M29 5v9h9"/><path d="M16 21l2 2 4-4M16 30l2 2 4-4M26 21h7M26 30h7M16 38h17"/></svg>
        <b>OGE Homework</b>
        <svg class="ar" viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
      </button>
      <button class="go" type="button" data-open="homework">
        <svg class="ic" viewBox="0 0 48 48"><rect class="f" x="4" y="7" width="40" height="27" rx="3"/><path d="M20 15v11l9-5.5z"/><path d="M18 42h12M24 34v8"/></svg>
        <b>ON SCREEN Homework</b>
        <svg class="ar" viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
      </button>
      <button class="go" type="button" data-open="practice">
        <svg class="ic" viewBox="0 0 48 48"><rect class="f" x="6" y="30" width="7" height="12"/><rect class="f" x="18" y="22" width="7" height="20"/><rect class="f" x="30" y="14" width="7" height="28"/><path d="M4 42h40M6 22l12-8 10 5 14-12M36 7h6v6"/></svg>
        <b>OGE Practice</b>
        <svg class="ar" viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>
</main>

<section class="screen" id="screen" aria-hidden="true">
  <header class="head">
    <button class="back" id="back" type="button">← Hub</button>
    <div class="ttl" id="title"></div>
  </header>
  <div class="ws" id="ws"></div>
</section>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const V='20261112e';
  const PAGES={
    oge:['OGE Homework','../timofey-oge-homework/?v='+V],
    homework:['ON SCREEN Homework','../timofey-homework/?v='+V],
    practice:['OGE Practice','../timofey-oge/?v='+V+'#reading']
  };
  const screen=$('screen');
  function openPage(key){
    const p=PAGES[key];if(!p)return;
    $('title').textContent=p[0];
    const ws=$('ws');ws.innerHTML='';
    const f=document.createElement('iframe');f.title=p[0];f.src=p[1];
    /* inner pages have their own "← Hub" link; the bar above already has one */
    f.addEventListener('load',()=>{try{f.contentDocument.querySelectorAll('a[href="../timofey/"]').forEach(a=>a.style.display='none');}catch(e){}});
    ws.appendChild(f);
    screen.classList.add('open');screen.setAttribute('aria-hidden','false');
  }
  function closeScreen(){screen.classList.remove('open');screen.setAttribute('aria-hidden','true');$('ws').innerHTML='';}
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.open)));
  $('back').addEventListener('click',closeScreen);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&screen.classList.contains('open'))closeScreen();});
  if(location.hash)history.replaceState(null,'',location.pathname); // always start on the main screen
})();
</script>
</body>
</html>
