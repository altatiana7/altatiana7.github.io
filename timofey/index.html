<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Timofey's English Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8efff;font-family:Inter,Segoe UI,Arial,sans-serif}
button{font:inherit}
.stage{position:fixed;inset:0;overflow:hidden;background:#d8efff}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}
.module-zone{position:absolute;z-index:5;left:2.3%;top:19.8%;width:18.9%;height:54.5%;display:flex;flex-direction:column;gap:.45vh;pointer-events:auto}
.module{border:1px solid rgba(104,205,255,.42);border-radius:10px;background:rgba(4,66,125,.74);backdrop-filter:blur(3px);overflow:hidden;box-shadow:inset 0 0 16px rgba(56,173,255,.06)}
.module-btn{width:100%;height:5.15vh;min-height:38px;border:0;background:transparent;color:#fff;display:flex;align-items:center;gap:.55vw;padding:0 .55vw;cursor:pointer;text-align:left}
.module-btn:hover,.module.open .module-btn{background:linear-gradient(90deg,rgba(12,142,238,.54),rgba(39,174,255,.17))}
.module-num{width:2.6vw;min-width:34px;height:3.65vh;min-height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(180deg,#3aa9ff,#126fbf);border:1px solid rgba(177,229,255,.76);font-size:clamp(16px,1.25vw,24px);font-weight:900}
.module-name{font-size:clamp(12px,.92vw,17px);font-weight:850;white-space:nowrap}.chev{margin-left:auto;font-size:20px;transition:.18s}.module.open .chev{transform:rotate(90deg)}
.lessons{display:none;padding:.05vh .35vw .45vh;gap:.28vh}.module.open .lessons{display:grid}
.lesson{height:3.75vh;min-height:32px;border-radius:8px;border:1px solid rgba(125,211,255,.55);background:linear-gradient(90deg,rgba(30,143,226,.94),rgba(13,93,169,.95));color:#fff;text-align:left;padding:0 .62vw;font-weight:800;font-size:clamp(11px,.8vw,15px);cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.lesson:hover{filter:brightness(1.12)}
.right-hotspots{position:absolute;z-index:6;right:2.3%;top:20.6%;width:16.8%;height:61.2%;display:grid;grid-template-rows:repeat(6,1fr);gap:.7vh}
.hot{border:0;background:transparent;cursor:pointer;border-radius:14px}
.hot:focus-visible,.hero-hot:focus-visible{outline:4px solid #fff;outline-offset:2px}
.hero-hot{position:absolute;z-index:6;left:25.4%;top:50.5%;width:19.5%;height:7.5%;border:0;background:transparent;cursor:pointer;border-radius:16px}
.screen{position:fixed;inset:0;z-index:20;display:none;background:linear-gradient(135deg,#eef9ff,#cfeaff 55%,#effaff);color:#083f70}
.screen.open{display:block}.head{height:74px;display:flex;align-items:center;gap:14px;padding:0 20px;background:rgba(255,255,255,.84);border-bottom:1px solid rgba(19,105,171,.18);backdrop-filter:blur(12px)}
.back,.close{width:50px;height:50px;border-radius:13px;border:1px solid rgba(41,135,201,.25);background:#fff;color:#0d63ad;font-size:24px;font-weight:900;cursor:pointer}.close{margin-left:auto}
.kind{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#208bc7;font-weight:900}.ttl{font-size:clamp(24px,2.2vw,40px);font-weight:900}
.blank{height:calc(100% - 74px);display:grid;place-items:center;padding:22px}
.card{width:min(900px,78vw);min-height:48vh;border:1px solid rgba(37,137,202,.22);border-radius:26px;background:rgba(255,255,255,.72);box-shadow:0 24px 70px rgba(44,114,160,.14);display:grid;place-items:center;text-align:center;padding:40px}
.card h2{font-size:clamp(38px,4.6vw,76px);margin:0 0 10px}.card p{font-size:clamp(16px,1.25vw,21px);color:#66869e;margin:0}
@media(max-width:1100px){.module-zone{left:1.4%;width:20.5%}.right-hotspots{right:1.4%;width:18.2%}}
</style>
</head>
<body>
<div class="stage">
  <img class="bg" src="./design.jpg" alt="Timofey's English Hub">
  <div class="module-zone" id="modules" aria-label="Modules"></div>
  <button class="hero-hot" type="button" aria-label="Open Lesson 1"></button>
  <div class="right-hotspots" id="oge" aria-label="OGE sections"></div>
</div>

<section class="screen" id="screen" aria-hidden="true">
  <header class="head">
    <button class="back" type="button" aria-label="Back">←</button>
    <div><div class="kind" id="kind">LESSON</div><div class="ttl" id="ttl">Lesson 1</div></div>
    <button class="close" type="button" aria-label="Close">×</button>
  </header>
  <div class="blank"><div class="card"><div><h2 id="cardTitle">Lesson 1</h2><p>Full-screen lesson space. We’ll add the content here gradually.</p></div></div></div>
</section>

<script>
const modules=document.getElementById('modules');
const screen=document.getElementById('screen');
const ttl=document.getElementById('ttl'), kind=document.getElementById('kind'), cardTitle=document.getElementById('cardTitle');
const names=['Everyday Life','Education','The World Around Us','Culture & Media','Technology','Travel & Future','Revision'];
let lessonNo=1;
names.forEach((name,i)=>{
  const box=document.createElement('div'); box.className='module'+(i===0?' open':'');
  const top=document.createElement('button'); top.className='module-btn'; top.type='button';
  top.innerHTML='<span class="module-num">'+(i+1)+'</span><span class="module-name">'+name+'</span><span class="chev">›</span>';
  const list=document.createElement('div'); list.className='lessons';
  const count=i===6?2:3;
  for(let j=0;j<count;j++){
    const n=lessonNo++;
    const b=document.createElement('button'); b.className='lesson'; b.type='button';
    b.innerHTML='<span>Lesson '+n+'</span><span>›</span>';
    b.addEventListener('click',e=>{e.stopPropagation();openScreen('LESSON','Lesson '+n,'lesson-'+n)});
    list.appendChild(b);
  }
  top.addEventListener('click',()=>{
    document.querySelectorAll('.module').forEach(m=>{if(m!==box)m.classList.remove('open')});
    box.classList.toggle('open');
  });
  box.append(top,list); modules.appendChild(box);
});
const ogeNames=['Listening','Reading','Grammar','Vocabulary','Writing','Speaking'];
const oge=document.getElementById('oge');
ogeNames.forEach(n=>{
  const b=document.createElement('button'); b.className='hot'; b.type='button'; b.setAttribute('aria-label',n);
  b.addEventListener('click',()=>openScreen('ОГЭ',n,'oge-'+n.toLowerCase()));
  oge.appendChild(b);
});
document.querySelector('.hero-hot').addEventListener('click',()=>openScreen('LESSON','Lesson 1','lesson-1'));
document.querySelector('.back').addEventListener('click',closeScreen);
document.querySelector('.close').addEventListener('click',closeScreen);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&screen.classList.contains('open'))closeScreen()});
function openScreen(k,t,h){kind.textContent=k;ttl.textContent=t;cardTitle.textContent=t;screen.classList.add('open');screen.setAttribute('aria-hidden','false');history.replaceState(null,'','#'+h)}
function closeScreen(){screen.classList.remove('open');screen.setAttribute('aria-hidden','true');history.replaceState(null,'',location.pathname+location.search)}
(function(){const h=location.hash.slice(1);if(/^lesson-\d+$/.test(h)){const n=+h.split('-')[1];if(n>=1&&n<=20)openScreen('LESSON','Lesson '+n,h)}else if(h.startsWith('oge-')){const n=h.slice(4);const f=ogeNames.find(x=>x.toLowerCase()===n);if(f)openScreen('ОГЭ',f,h)}})();
</script>
</body>
</html>
