<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Timofey's English Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020b18;overflow:hidden;font-family:Arial,Helvetica,sans-serif}.shell{width:100%;height:100%;display:grid;place-items:center;background:#020b18}.stage{position:relative;width:min(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941;opacity:0;transition:opacity .18s ease}.stage.ready{opacity:1}.design{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;border:0;background:transparent;padding:0;margin:0;cursor:pointer;border-radius:12px;outline:none;-webkit-tap-highlight-color:transparent}.hotspot:focus-visible{outline:3px solid rgba(81,203,255,.95);outline-offset:2px}.lesson-grid{position:absolute;left:2.48%;top:21.45%;width:18.02%;height:46.05%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr);column-gap:2.7%;row-gap:2.65%}.lesson-grid .hotspot{position:relative;width:100%;height:100%}.oge-grid{position:absolute;left:77.82%;top:20.85%;width:18.28%;height:61.55%;display:grid;grid-template-rows:repeat(6,1fr);row-gap:1.55%}.oge-grid .hotspot{position:relative;width:100%;height:100%}.hero-open{left:25.12%;top:50.15%;width:17.38%;height:7.15%}.loading{position:fixed;inset:0;display:grid;place-items:center;color:#9bdcff;background:#020b18;font-size:14px;letter-spacing:.08em;z-index:5}.loading.hidden{display:none}.overlay{position:fixed;inset:0;z-index:20;background:linear-gradient(145deg,#041328,#061b35 55%,#03101f);color:white;display:none}.overlay.open{display:grid;grid-template-rows:auto 1fr}.overlay-head{height:74px;display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid rgba(98,190,255,.22);background:rgba(3,14,31,.94)}.overlay-title{margin:0;font-size:clamp(22px,2.2vw,34px);font-weight:800;letter-spacing:-.02em}.overlay-spacer{flex:1}.overlay-btn{width:48px;height:48px;border:1px solid rgba(98,190,255,.34);border-radius:12px;background:rgba(14,43,76,.72);color:white;font-size:24px;cursor:pointer}.overlay-btn:hover,.overlay-btn:focus-visible{background:rgba(28,95,148,.72);outline:none}.workspace{position:relative;min-height:0;display:grid;place-items:center;padding:28px}.empty{font-size:clamp(18px,2vw,30px);font-weight:700;color:rgba(221,241,255,.34);text-align:center}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-aspect-ratio:1672/941){.stage{width:100vw;height:auto}}@media(min-aspect-ratio:1672/941){.stage{height:100vh;width:auto}}@media(prefers-reduced-motion:reduce){.stage{transition:none}}
</style>
</head>
<body>
<div class="loading" id="loading">Loading Timofey's English Hub…</div>
<div class="shell" id="shell">
  <div class="stage" id="stage" aria-label="Timofey's English Hub">
    <img class="design" id="design" alt="Timofey's English Hub with 20 Modules and OGE sections">
    <div class="lesson-grid" id="lessonGrid" aria-label="Modules 1 to 20"></div>
    <div class="oge-grid" id="ogeGrid" aria-label="OGE sections"></div>
    <button class="hotspot hero-open" id="heroOpen" type="button" aria-label="Open Lesson 1"></button>
  </div>
</div>

<section class="overlay" id="overlay" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
  <header class="overlay-head">
    <button class="overlay-btn" id="backBtn" type="button" aria-label="Back to hub">←</button>
    <h1 class="overlay-title" id="overlayTitle">Lesson 1</h1>
    <div class="overlay-spacer"></div>
    <button class="overlay-btn" id="closeBtn" type="button" aria-label="Close">×</button>
  </header>
  <main class="workspace" id="workspace">
    <div class="empty" id="emptyText">Материал будет добавлен позже</div>
  </main>
</section>

<script>
(()=>{
  const stage=document.getElementById('stage');
  const design=document.getElementById('design');
  const loading=document.getElementById('loading');
  const lessonGrid=document.getElementById('lessonGrid');
  const ogeGrid=document.getElementById('ogeGrid');
  const heroOpen=document.getElementById('heroOpen');
  const overlay=document.getElementById('overlay');
  const overlayTitle=document.getElementById('overlayTitle');
  const emptyText=document.getElementById('emptyText');
  const closeBtn=document.getElementById('closeBtn');
  const backBtn=document.getElementById('backBtn');
  const oge=['Listening','Reading','Grammar','Vocabulary','Writing','Speaking'];

  for(let i=1;i<=20;i++){
    const b=document.createElement('button');
    b.type='button';
    b.className='hotspot';
    b.setAttribute('aria-label','Open Lesson '+i);
    b.addEventListener('click',()=>openPanel('lesson',String(i),true));
    lessonGrid.appendChild(b);
  }

  oge.forEach(name=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='hotspot';
    b.setAttribute('aria-label','Open OGE '+name);
    b.addEventListener('click',()=>openPanel('oge',name,true));
    ogeGrid.appendChild(b);
  });

  heroOpen.addEventListener('click',()=>openPanel('lesson','1',true));

  function slug(s){return String(s).toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'')}

  function openPanel(type,key,userGesture){
    const title=type==='lesson'?'Lesson '+Number(key):'ОГЭ · '+key;
    overlayTitle.textContent=title;
    emptyText.textContent=type==='lesson'?'Материал для '+title+' будет добавлен позже':'Материал раздела «'+key+'» будет добавлен позже';
    overlay.classList.add('open');
    overlay.setAttribute('aria-hidden','false');
    const hash=type==='lesson'?'lesson-'+String(Number(key)).padStart(2,'0'):'oge-'+slug(key);
    history.replaceState(null,'','#'+hash);
    closeBtn.focus({preventScroll:true});
    if(userGesture && document.documentElement.requestFullscreen && !document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  }

  function closePanel(){
    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden','true');
    history.replaceState(null,'',location.pathname+location.search);
    if(document.fullscreenElement && document.exitFullscreen){document.exitFullscreen().catch(()=>{})}
  }

  closeBtn.addEventListener('click',closePanel);
  backBtn.addEventListener('click',closePanel);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open'))closePanel()});

  function openFromHash(){
    const h=location.hash.slice(1);
    if(!h)return;
    let m=h.match(/^lesson-(\d{1,2})$/);
    if(m){const n=Number(m[1]);if(n>=1&&n<=20)openPanel('lesson',String(n),false);return}
    m=h.match(/^oge-(.+)$/);
    if(m){const found=oge.find(x=>slug(x)===m[1]);if(found)openPanel('oge',found,false)}
  }

  async function loadDesign(){
    try{
      const files=['bg1.txt','bg2.txt','bg3.txt'];
      const chunks=await Promise.all(files.map(async f=>{
        const r=await fetch(f,{cache:'no-store'});
        if(!r.ok)throw new Error('Could not load '+f);
        return (await r.text()).trim();
      }));
      design.onload=()=>{
        loading.classList.add('hidden');
        stage.classList.add('ready');
        openFromHash();
      };
      design.onerror=()=>{throw new Error('Image decode failed')};
      design.src='data:image/webp;base64,'+chunks.join('');
    }catch(err){
      loading.textContent='Не удалось загрузить страницу. Обновите браузер.';
      console.error(err);
    }
  }

  loadDesign();
})();
</script>
</body>
</html>
