<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Timofey's English Hub</title>
<style>
/* Same look as the Teacher's Hub (../timofey-teacher/), student version */
:root{
  --ink:#0e1a33; --muted:#4d5b73; --blue:#1d8cf0; --blue2:#0a5fd6; --line:#d7e3f2;
  --sky1:#eaf4ff; --sky2:#f7fbff; --card:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Georgia,"Times New Roman",Times,serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 85% -10%,#cfe7ff 0%,transparent 60%),linear-gradient(180deg,var(--sky1),var(--sky2));}
button{font:inherit;color:inherit}

.hub{height:100vh;display:grid;grid-template-columns:minmax(300px,36%) minmax(0,1fr);gap:22px;padding:18px 22px}
.left{position:relative;min-height:0;border-radius:22px;overflow:hidden;box-shadow:0 18px 40px rgba(20,60,120,.18)}
.left img{width:100%;height:100%;object-fit:cover;object-position:50% 0%;display:block}
.meet{position:absolute;left:14px;bottom:14px;max-width:62%;background:rgba(235,245,255,.93);backdrop-filter:blur(4px);
  border:1px solid #bcd7f5;border-radius:14px;padding:10px 14px 10px 12px;transform:rotate(-2deg);box-shadow:0 8px 18px rgba(20,60,120,.15)}
.meet .tag{display:inline-block;font-style:italic;font-size:22px;font-weight:700;line-height:1;background:#fff3a6;padding:3px 10px;border-radius:4px;transform:rotate(-3deg);margin:-2px 0 6px -4px}
.meet ul{margin:0;padding:0;list-style:none;font-style:italic;font-size:17px;line-height:1.3}
.meet li::before{content:"✓ ";font-weight:700}

.right{min-height:0;display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;gap:14px}
.title{flex:1;min-width:0}
h1{margin:0;font-size:clamp(30px,3.6vw,48px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
h1 em{font-style:normal;background:linear-gradient(90deg,#1aa4ff,#0b5fe0);-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:inline-block;margin-top:8px;padding:4px 16px;border-radius:999px;font-weight:900;font-size:clamp(15px,1.4vw,18px);color:#fff;background:#2a8f9f}
.badge{flex:0 0 auto;width:clamp(56px,5.4vw,74px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:clamp(20px,2.1vw,28px);
  background:radial-gradient(circle at 35% 30%,#4fb7ff,#0b5fe0 70%);box-shadow:0 0 0 4px #d6ecff}
.badge small{display:block;font-size:11px;font-weight:800;text-align:center;line-height:1;margin-top:-4px;opacity:.9}

.grp{display:flex;flex-direction:column;gap:7px}
.grp h3{margin:0;font-size:15px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.g-main{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{position:relative;display:flex;align-items:center;gap:12px;text-align:left;min-height:68px;padding:10px 14px;
  background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:background .12s,border-color .12s}
.card:hover{background:#f4f9ff;border-color:#9fc3ee}
.card:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.g-main .card{min-height:82px;border:2px solid #b9d8ff}
.ic{width:42px;height:42px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;background:#e6effa}
.ic svg{width:24px;height:24px;fill:none;stroke:#1f4f8f;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.g-main .ic{width:50px;height:50px;background:linear-gradient(135deg,#2f7cf6,#59a8ff)}
.g-main .ic svg{width:28px;height:28px;stroke:#fff}
.tx{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.card b{font-size:19px;font-weight:700;line-height:1.15}
.g-main .card b{font-size:22px}
.card span{font-size:15px;color:var(--muted);line-height:1.2}

/* section screen */
.screen{position:fixed;inset:0;z-index:30;display:none;background:#eef3f8}
.screen.open{display:grid;grid-template-rows:40px 1fr}
.head{display:flex;align-items:center;gap:14px;padding:0 18px;background:linear-gradient(90deg,#0b5fe0,#1d8cf0);color:#fff}
.back{border:0;border-radius:8px;background:#fff;color:var(--ink);font-weight:800;font-size:15px;padding:4px 12px;cursor:pointer}
.ttl{font-size:17px;font-weight:900}.ttl small{font-size:14px;font-weight:700;opacity:.8;margin-right:8px}
.ws{min-height:0}
.ws iframe{width:100%;height:100%;border:0;display:block}

@media(max-width:900px){
  html,body{height:auto}
  .hub{height:auto;grid-template-columns:1fr;padding:12px 16px}
  .left{height:380px}
  .meet{max-width:58%;padding:6px 10px;bottom:10px;left:10px}.meet .tag{font-size:18px}.meet ul{font-size:14px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-main{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<main class="hub">
  <section class="left">
    <img src="../timofey-teacher/timofey-teacher.jpg?v=20261015b" alt="Timofey">
    <div class="meet">
      <div class="tag">Meet Timofey</div>
      <ul><li>9th grade · OGE 2027</li><li>Tech-addicted</li><li>Curious</li><li>Smart &amp; creative</li><li>Future programmer</li></ul>
    </div>
  </section>

  <section class="right">
    <div class="top">
      <div class="title">
        <h1>Timofey's English <em>Hub</em></h1>
        <div class="pill">OGE 2027 · English</div>
      </div>
      <div class="badge"><div>B2<small>OGE</small></div></div>
    </div>

    <div class="grp"><h3>Homework</h3><div class="grid g-main" id="g-main"></div></div>
    <div class="grp"><h3>OGE practice</h3><div class="grid" id="g-oge"></div></div>
  </section>
</main>

<section class="screen" id="screen" aria-hidden="true">
  <header class="head">
    <button class="back" id="back" type="button">← Hub</button>
    <div class="ttl"><small id="kind"></small><span id="title"></span></div>
  </header>
  <div class="ws" id="ws"></div>
</section>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const V='20261112d';
  const oge=s=>'../timofey-oge/?v='+V+'#'+encodeURIComponent(s);
  const I={
    book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/>',
    cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3M8 17h6"/>',
    read:'<path d="M2 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v12a2 2 0 0 1 2-2h8z"/>',
    gear:'<circle cx="9" cy="14" r="3.2"/><path d="M9 8v2.5M9 17.5V20M3 14h2.5M12.5 14H15M4.8 9.8l1.8 1.8M11.4 16.4l1.8 1.8M4.8 18.2l1.8-1.8M11.4 11.6l1.8-1.8"/><circle cx="17.5" cy="6.5" r="2.4"/>',
    word:'<path d="M4 20l5-14 5 14M6 15h6"/><path d="M16 9h5M18.5 6.5v5"/>',
    pen:'<path d="M3 21l3.5-1 11-11-2.5-2.5-11 11z"/><path d="M14 5.5l2.5-2.5 4.5 4.5-2.5 2.5"/>',
    chat:'<path d="M4 5h11a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M19 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v3l-3-3h-4"/>',
    stack:'<rect x="4" y="3" width="13" height="17" rx="2"/><path d="M8 7h5M8 11h5M8 15h3"/><path d="M20 6v14a2 2 0 0 1-2 2H8"/>'
  };
  const MAIN=[
    ['On Screen Homework','Your current homework',I.book,'Homework · ','../timofey-homework/?v='+V],
    ['OGE Homework','Tasks by date · done and sent',I.cal,'Homework · ','../timofey-oge-homework/?v='+V]
  ];
  const OGE=[
    ['Reading','True / False, matching',I.read,'OGE · ',oge('reading')],
    ['Grammar','Tasks 20–28',I.gear,'OGE · ',oge('grammar')],
    ['Word formation','Tasks 29–34',I.word,'OGE · ',oge('word formation')],
    ['Writing','Email',I.pen,'OGE · ',oge('writing')],
    ['Speaking','Read aloud, interview, talk',I.chat,'OGE · ',oge('speaking')],
    ['Book 2026','Variants 1–2',I.stack,'OGE · ',oge('book 2026')]
  ];
  function add(box,[name,sub,icon,kind,url]){
    const b=document.createElement('button');b.type='button';b.className='card';
    b.innerHTML='<div class="ic"><svg viewBox="0 0 24 24">'+icon+'</svg></div><div class="tx"><b></b><span></span></div>';
    b.querySelector('b').textContent=name;b.querySelector('span').textContent=sub;
    b.addEventListener('click',()=>openFrame(kind,name,url));
    $(box).appendChild(b);
  }
  MAIN.forEach(c=>add('g-main',c));OGE.forEach(c=>add('g-oge',c));

  const screen=$('screen');
  function openFrame(kind,name,url){
    $('kind').textContent=kind;$('title').textContent=name;
    const ws=$('ws');ws.innerHTML='';
    const f=document.createElement('iframe');f.title=name;f.src=url;
    /* inner pages have their own "← Hub" link; the blue bar above already has one */
    f.addEventListener('load',()=>{try{f.contentDocument.querySelectorAll('a[href="../timofey/"]').forEach(a=>a.style.display='none');}catch(e){}});
    ws.appendChild(f);
    screen.classList.add('open');screen.setAttribute('aria-hidden','false');
  }
  function closeScreen(){screen.classList.remove('open');screen.setAttribute('aria-hidden','true');$('ws').innerHTML='';}
  $('back').addEventListener('click',closeScreen);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&screen.classList.contains('open'))closeScreen();});
  if(location.hash)history.replaceState(null,'',location.pathname); // always start on the main screen
})();
</script>
</body>
</html>
