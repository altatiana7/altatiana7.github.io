<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OGE interactive · Timofey</title>
<style>
/* Design: Tatyana's "OGE interactive" cover (cover-oge.webp). The photo is the left part of that picture;
   title and buttons are real HTML on the right. */
:root{
  --bg:#dff3f1; --ink:#10282b; --muted:#4f6b6e; --violet:#16808a; --violet2:#0f6670; --lav:#a9dfdb; --line:#bfe2de;
  --sans:"Segoe UI","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:linear-gradient(110deg,#e9f7f5 0%,var(--bg) 55%,#cfebe8 100%)}
button{font:inherit;color:inherit}

.hub{height:100vh;display:grid;grid-template-columns:auto minmax(0,1fr);overflow:hidden}
.photo{height:100%;width:46vw;
  background:url("./cover-oge.webp?v=20261112") 0 38%/239% auto no-repeat;
  -webkit-mask-image:linear-gradient(90deg,#000 70%,transparent 99%);mask-image:linear-gradient(90deg,#000 70%,transparent 99%)}
.right{min-width:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(16px,3.5vh,28px);padding:24px clamp(20px,4vw,60px)}

/* calm, "developer" look: monospace title, thin narrow buttons */
h1{margin:0;font-family:var(--mono);font-size:clamp(28px,3.4vw,44px);font-weight:600;line-height:1.1;letter-spacing:-.01em;color:var(--ink)}
h1 em{font-style:normal;font-weight:400;color:var(--violet);background:#c7ebe7;border-radius:6px;padding:.02em .3em .06em}
h1 .cur{display:inline-block;width:.55em;height:.08em;margin-left:.1em;background:var(--violet);vertical-align:baseline;animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sub{margin:-8px 0 0;font-family:var(--mono);font-size:15px;color:var(--muted)}
.sub b{font-weight:400;color:var(--violet)}

.btns{display:flex;flex-direction:column;gap:12px}
.right>*{width:min(460px,100%)}
.go{display:flex;align-items:center;gap:16px;min-height:62px;padding:8px 18px;
  border:1px solid var(--line);border-radius:12px;cursor:pointer;text-align:left;
  background:rgba(255,255,255,.85);transition:background .12s,border-color .12s}
.go:hover{background:#fff;border-color:#7cc7c0}
.go:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
.go svg.ic{flex:0 0 auto;width:30px;height:30px;fill:none;stroke:var(--violet);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.go svg.ic .f{fill:none}
.go b{flex:1;font-size:20px;font-weight:500;line-height:1.2;color:var(--ink)}
.go svg.ar{flex:0 0 auto;width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.go:hover svg.ar{stroke:var(--violet)}
@media(prefers-reduced-motion:reduce){h1 .cur{animation:none}}

/* screen with the chosen section */
.screen{position:fixed;inset:0;z-index:30;display:none;background:#eef0f6}
.screen.open{display:grid;grid-template-rows:42px 1fr}
.head{display:flex;align-items:center;gap:14px;padding:0 18px;background:#1f4f55;color:#fff}
.back{border:0;border-radius:8px;background:#fff;color:var(--ink);font-weight:600;font-size:15px;padding:5px 12px;cursor:pointer}
.ttl{font-family:var(--mono);font-size:16px;font-weight:400}
.ws{min-height:0}
.ws iframe{width:100%;height:100%;border:0;display:block}

@media(max-width:800px){
  html,body{height:auto}
  .hub{height:auto;grid-template-columns:1fr}
  .photo{height:340px;width:auto;max-width:100%;aspect-ratio:700/941;margin:0 auto;background-size:auto 100%;background-position:left center;
    -webkit-mask-image:linear-gradient(180deg,#000 80%,transparent);mask-image:linear-gradient(180deg,#000 80%,transparent)}
  .right{padding:8px 16px 24px;margin-left:0}
  .go{gap:14px;padding:10px 16px}
}
@media(prefers-reduced-motion:reduce){.go{transition:none}}

/* Compact hub overlay; all linked sections get their own matching compact styles. */
.screen.open{grid-template-rows:32px minmax(0,1fr)}
.head{gap:8px;padding:0 10px}
.head .back{font-size:12px;padding:3px 9px;border-radius:5px}
.head .ttl{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:800px){.screen.open{grid-template-rows:34px minmax(0,1fr)}}
</style>
</head>
<body>
<main class="hub">
  <div class="photo" role="img" aria-label="Timofey"></div>
  <section class="right">
    <h1>OGE <em>interactive</em><span class="cur" aria-hidden="true"></span></h1>
    <p class="sub">timofey · grade 9 · goal: <b>OGE 2027</b></p>
    <div class="btns">
      <button class="go" type="button" data-open="oge">
        <svg class="ic" viewBox="0 0 48 48"><path class="f" d="M12 5h17l9 9v27a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/><path d="M29 5v9h9"/><path d="M16 21l2 2 4-4M16 30l2 2 4-4M26 21h7M26 30h7M16 38h17"/></svg>
        <b>OGE Homework</b>
        <svg class="ar" viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
      </button>
      <button class="go" type="button" data-open="homework">
        <svg class="ic" viewBox="0 0 48 48"><rect class="f" x="4" y="7" width="40" height="27" rx="3"/><path d="M20 15v11l9-5.5z"/><path d="M18 42h12M24 34v8"/></svg>
        <b>ON SCREEN Homework</b>
        <svg class="ar" viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
      </button>
      <button class="go" type="button" data-open="practice">
        <svg class="ic" viewBox="0 0 48 48"><rect class="f" x="6" y="30" width="7" height="12"/><rect class="f" x="18" y="22" width="7" height="20"/><rect class="f" x="30" y="14" width="7" height="28"/><path d="M4 42h40M6 22l12-8 10 5 14-12M36 7h6v6"/></svg>
        <b>OGE Practice</b>
        <svg class="ar" viewBox="0 0 24 24"><path d="M3 12h17M14 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>
</main>

<section class="screen" id="screen" aria-hidden="true">
  <header class="head">
    <button class="back" id="back" type="button">← Hub</button>
    <div class="ttl" id="title"></div>
  </header>
  <div class="ws" id="ws"></div>
</section>

<script>
(()=>{
  const $=id=>document.getElementById(id);
  const V='20261113separated';
  const PAGES={
    oge:['OGE Homework','../timofey-oge-homework/?v='+V],
    homework:['ON SCREEN Homework','../timofey-homework/?v='+V],
    practice:['OGE Practice','../timofey-oge/?v='+V+'#reading']
  };
  const screen=$('screen');
  function openPage(key){
    const p=PAGES[key];if(!p)return;
    $('title').textContent=p[0];
    const ws=$('ws');ws.innerHTML='';
    const f=document.createElement('iframe');f.title=p[0];f.src=p[1];
    /* inner pages have their own "← Hub" link; the bar above already has one */
    f.addEventListener('load',()=>{try{
      const doc=f.contentDocument;
      doc.querySelectorAll('a[href="../timofey/"]').forEach(a=>a.style.display='none');
      if(key==='oge')doc.body.classList.add('embed');
    }catch(e){}});
    ws.appendChild(f);
    screen.classList.add('open');screen.setAttribute('aria-hidden','false');
  }
  function closeScreen(){screen.classList.remove('open');screen.setAttribute('aria-hidden','true');$('ws').innerHTML='';}
  document.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.open)));
  $('back').addEventListener('click',closeScreen);
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&screen.classList.contains('open'))closeScreen();});
  if(location.hash)history.replaceState(null,'',location.pathname); // always start on the main screen
})();
</script>
</body>
</html>
