<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OGE Listening · Green Week</title>
<style>
:root{--ink:#142632;--bg:#eef5f3;--card:#fff;--line:#c8dcda;--accent:#176e72;--ok:#216a48;--bad:#9c3434}*{box-sizing:border-box}body{margin:0;font:17px/1.45 Arial,sans-serif;color:var(--ink);background:var(--bg)}header{height:48px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#173f4d;color:white}header a{color:white;text-decoration:none;font-weight:700}.wrap{max-width:1120px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}h1{margin:0;font-size:22px}h2{margin:0 0 10px;font-size:20px}.muted{color:#587078}.controls{display:grid;gap:10px}.btn{border:1px solid var(--accent);border-radius:9px;padding:11px 14px;background:#fff;color:#12565c;font:700 16px Arial;cursor:pointer}.btn.primary{background:var(--accent);color:white}.btn:disabled{opacity:.55;cursor:not-allowed}.q{border-top:1px solid var(--line);padding:13px 0}.q:first-child{border-top:0}.q p{margin:0 0 8px;font-weight:700}.opts{display:flex;gap:8px;flex-wrap:wrap}.opt{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 11px;font:inherit;cursor:pointer}.opt.sel{background:#dff0ee;border-color:var(--accent)}.status{min-height:24px;font-weight:700}.locked .opt{pointer-events:none}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:10px}body{font-size:16px}}
</style></head><body>
<header><a href="./">← Homework</a><b>OGE Listening · Green Week</b></header>
<main class="wrap"><div class="grid"><aside class="card"><h1>Listen twice</h1><p class="muted">The script is hidden. Listen, then answer 10 questions. You get one attempt.</p><div class="controls"><button class="btn primary" id="play">▶ Listen</button><button class="btn" id="stop">Stop</button><button class="btn primary" id="send">Send answers</button></div><p class="status" id="status"></p></aside><section class="card" id="quiz"><h2>Choose A, B or C</h2></section></div></main>
<script>
const scriptText="Good morning. This is the head teacher with a message about Green Week. It will take place from Monday the fourteenth to Friday the eighteenth of March. On Monday, students will bring a reusable bottle instead of buying drinks in plastic cups. On Tuesday, our science teacher, Mr Brown, will give a short talk about saving energy at home. The talk starts at three thirty in Room Twelve. On Wednesday, each class will collect old batteries and small electronic devices. Please put them in the boxes near the school library before lunchtime. Thursday is bicycle day. If you live nearby, come to school by bike or on foot. Finally, on Friday, the eco-club will organise a sale of used books in the main hall. Bring books you have already read, but please do not bring magazines. The money will buy plants for the school garden. Thank you for taking part.";
const data=[
["Green Week lasts for",["three days","five days","seven days"],"five days"],
["On Monday students should use",["reusable bottles","paper bags","new cups"],"reusable bottles"],
["The talk on Tuesday is about",["wild animals","saving energy","school food"],"saving energy"],
["Mr Brown's talk begins at",["3:00","3:30","4:30"],"3:30"],
["On Wednesday students collect",["clothes and shoes","batteries and small devices","plastic bottles only"],"batteries and small devices"],
["The collection boxes are near",["the gym","the library","Room Twelve"],"the library"],
["Students should bring things on Wednesday before",["lunchtime","the end of school","the science talk"],"lunchtime"],
["Thursday is",["walking day","bicycle day","sports day"],"bicycle day"],
["The book sale is held in",["the school garden","Room Twelve","the main hall"],"the main hall"],
["The money from the sale will buy",["new computers","plants","magazines"],"plants"]
];
const key="timofey.oge.listening.20261120",saved=JSON.parse(localStorage.getItem(key)||"null"),state=saved||{a:{},locked:false};let utterance=null;
const quiz=document.getElementById("quiz"),status=document.getElementById("status");
function render(){quiz.innerHTML="<h2>Choose A, B or C</h2>";quiz.classList.toggle("locked",state.locked);data.forEach((x,i)=>{const q=document.createElement("div");q.className="q";q.innerHTML="<p>"+(i+1)+". "+x[0]+"</p>";const box=document.createElement("div");box.className="opts";x[1].forEach(o=>{const b=document.createElement("button");b.className="opt"+(state.a[i]===o?" sel":"");b.textContent=o;b.onclick=()=>{if(state.locked)return;state.a[i]=o;localStorage.setItem(key,JSON.stringify(state));render()};box.appendChild(b)});q.appendChild(box);quiz.appendChild(q)});if(state.locked){const score=data.filter((x,i)=>state.a[i]===x[2]).length;status.textContent="Sent · "+score+" / "+data.length;document.getElementById("send").disabled=true}}
function speak(){speechSynthesis.cancel();utterance=new SpeechSynthesisUtterance(scriptText);utterance.lang="en-GB";utterance.rate=.9;const v=speechSynthesis.getVoices().find(v=>/^en-GB/i.test(v.lang));if(v)utterance.voice=v;speechSynthesis.speak(utterance);status.textContent="Listening…"}
document.getElementById("play").onclick=speak;document.getElementById("stop").onclick=()=>{speechSynthesis.cancel();status.textContent="Stopped."};document.getElementById("send").onclick=()=>{if(Object.keys(state.a).length<10){status.textContent="Answer all 10 questions first.";return}state.locked=true;localStorage.setItem(key,JSON.stringify(state));render()};render();
</script></body></html>
