<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timofey — OGE Homework</title>
<style>
:root{
  --bg:#cdd6dc; --card:#edf1f3; --card2:#dde4e8; --ink:#1d2932; --muted:#566673; --line:#b3c0c9; --steel:#44637d;
  --accent:#41705f; --ok:#2f6f54; --okbg:#e3f1ea;
  --serif:Georgia,"Times New Roman",Times,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink);font-family:var(--serif);background:var(--bg);
  background-image:linear-gradient(rgba(40,60,75,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(40,60,75,.07) 1px,transparent 1px);
  background-size:32px 32px}
a{color:inherit;text-decoration:none}
.page{height:100%;display:flex;flex-direction:column;gap:12px;padding:14px 18px}
.top{flex:0 0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:6px;background:var(--card2);font-size:15px;font-weight:700;padding:5px 12px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.top h1{margin:0;font-size:22px;flex:1}
.legend{display:flex;gap:8px;font-size:14px;color:var(--muted);align-items:center}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tab{padding:7px 16px;background:var(--steel);color:#e6edf2;font-size:16px}
.tab b{color:#a8d8c2}

.practice .row{display:grid;grid-template-columns:repeat(6,auto);gap:8px;padding:10px 12px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:46px;padding:0 10px;
  border:1px solid var(--line);border-radius:6px;background:var(--card2);font-size:17px;font-weight:700;white-space:nowrap}
.sec span{color:var(--muted);font-weight:400}
.sec:hover{border-color:var(--accent);color:var(--accent)}

.hw{flex:1;min-height:0;display:flex;flex-direction:column}
.hw .list{flex:1;min-height:0;overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.day{border:1px solid var(--line);border-radius:8px;background:#f6f8f9}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line)}
.day-h h2{margin:0;font-size:20px}
.day-h .cnt{font-size:16px;color:var(--muted)}
.day-h .cnt.all{color:var(--ok);font-weight:700}
.rows{display:grid;grid-template-columns:1fr;gap:4px 22px;padding:8px 14px 10px}
.rows.one{grid-template-columns:1fr}

.r{display:flex;align-items:center;gap:10px;min-height:42px}
.r .lab{flex:0 0 150px;font-size:17px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 11px;border:1px solid var(--line);border-radius:6px;
  background:var(--card2);font-size:16px;font-weight:700;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip i{font-style:normal;font-weight:400;font-size:13px;color:var(--muted)}
.chip.done{border-color:var(--ok);color:var(--ok);background:#fff}
.chip.done i{color:var(--ok)}
.chip.sent{border-color:var(--ok);background:var(--ok);color:#fff}
.chip.sent i{color:#d6efe3}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:900px){
  html,body{height:auto}
  .practice .row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sec{white-space:normal}
  .rows{grid-template-columns:1fr}
  .hw .list{overflow:visible}
}

/* Balanced classroom layout: comfortable, readable, space-efficient */
html,body{height:100%;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;font-size:15px;line-height:1.35}
.page{height:100dvh;min-height:0;gap:8px;padding:8px 12px}
.top{flex:0 0 auto;gap:10px;min-height:34px}
.top h1{font-size:19px;line-height:1.2;font-weight:650}
.top .btn{font-size:14px;padding:5px 10px}
.legend{gap:6px;font-size:13px}
.legend .chip{height:28px;font-size:13px;padding:0 9px}
.panel{border-radius:8px}
.tab{font-size:14px;padding:6px 12px;line-height:1.15}
.practice{flex:0 0 auto}
.practice .row{grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;padding:8px}
.sec{font-size:15px;font-weight:600;min-height:40px;padding:6px 10px;white-space:nowrap}
.hw{flex:1;min-height:0}
.hw .list{display:flex;flex-direction:column;gap:8px;padding:8px;overflow:auto;scrollbar-width:thin}
.day{flex:0 0 auto;border-radius:7px}
.day-h{min-height:36px;align-items:center;gap:8px;padding:7px 12px;cursor:pointer}
.day-h h2{font-size:17px;font-weight:650}
.day-h .cnt{font-size:13px}
.day-h::after{content:"▾";font:17px Arial,sans-serif;color:var(--muted);margin-left:6px}
.day.collapsed .day-h::after{content:"▸"}
.day.collapsed .rows{display:none}
.rows,.rows.one{grid-template-columns:1fr;gap:4px;padding:8px 12px}
.r{min-height:34px;gap:10px}
.r .lab{flex:0 0 125px;font-size:15px}
.chips{gap:6px}
.chip{height:31px;font-size:14px;padding:0 10px;gap:5px}
.chip i{font-size:12px}
.embed .top{display:none}
@media(max-width:1000px){.practice .row{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.page{padding:6px}.practice .row{grid-template-columns:repeat(2,minmax(0,1fr))}.r{flex-wrap:wrap;gap:4px}.r .lab{flex:0 0 100%}.chips{width:100%}}


/* Teacher assignment log: hidden from students and independent of pupil submission */
.teacher-tools{display:none;align-items:center;gap:8px;flex-wrap:wrap}
.teacher .teacher-tools{display:flex}
.teacher .teacher-note{display:block}
.teacher-note{display:none;font-size:12px;color:var(--muted);padding:0 4px}
.teacher-summary{font-size:13px;font-weight:600;color:#355c50}
.given-mark{font:600 12px/1.2 "Segoe UI",Arial,sans-serif;height:30px;border:1px solid #9bacb1;border-radius:5px;background:#fff;color:#36505b;padding:0 8px;cursor:pointer;white-space:nowrap}
.given-mark.active{border-color:#357b62;background:#d9eee3;color:#24543e}
.given-mark:focus-visible{outline:2px solid #357b62}
.teacher .chips{align-items:center}
.teacher .given-pair{display:inline-flex;align-items:center;gap:3px;padding-right:6px;border-right:1px solid #ccd6d8}
.teacher .given-pair:last-child{border-right:0}
.teacher .chip{height:30px}
.teacher .teacher-tools .btn{font-size:13px}
@media(max-width:650px){.teacher .given-pair{gap:2px;padding-right:3px}.given-mark{font-size:11px;padding:0 6px}}
.teacher.embed .top{display:flex;min-height:36px}
.teacher.embed .top>a.btn,.teacher.embed .top>h1,.teacher.embed .top>.legend{display:none}
.teacher.embed .top .teacher-tools{display:flex;flex:1;justify-content:space-between}
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <a class="btn" href="../timofey/">← Hub</a>
    <h1>OGE Homework</h1>
    <div class="teacher-tools" id="teacherTools"><strong class="teacher-summary" id="teacherSummary">Выдано: 0</strong><button class="btn" type="button" id="teacherExport">Список выданного</button></div>
    <div class="legend">
      <span class="chip">To do</span><span class="chip done">Done <i>✓</i></span><span class="chip sent">Sent <i>✓</i></span>
    </div>
  </header>

  <p class="teacher-note">Учительские отметки «Выдано» хранятся в этом браузере. Они не отправляют задания ученику и не изменяют статусы Done / Sent.</p>
  <section class="panel hw">
    <div class="tab"><b>//</b> homework</div>
    <div class="list" id="list"></div>
  </section>
</div>

<script src="../timofey-oge/oge-data.js?v=20261024"></script>
<script src="../timofey-oge/oge-book.js?v=20261024"></script>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  try{if(self!==top)document.body.classList.add("embed");}catch(e){}
  var teacher=/[?&]teacher=1(?:&|$)/.test(location.search);
  if(teacher)document.body.classList.add("teacher");
  var GIVEN_KEY="timofey.oge.homework.given.teacher.v1";
  var given={};
  try{given=JSON.parse(localStorage.getItem(GIVEN_KEY)||"{}")||{};if(typeof given!=="object"||Array.isArray(given))given={};}catch(e){given={};}
  var assignments=[];
  function updateTeacherSummary(){
    if(!teacher)return;
    var count=assignments.filter(function(a){return !!given[a.key];}).length;
    $("teacherSummary").textContent="Выдано: "+count+" / "+assignments.length;
  }
  function markGiven(key,on,button){
    if(on)given[key]=new Date().toISOString();else delete given[key];
    try{localStorage.setItem(GIVEN_KEY,JSON.stringify(given));}catch(e){alert("Не удалось сохранить отметку в этом браузере.");}
    button.classList.toggle("active",on);
    button.textContent=on?"Выдано ✓":"Выдать";
    button.setAttribute("aria-pressed",String(on));
    updateTeacherSummary();
  }
  if(teacher)$("teacherExport").addEventListener("click",function(){
    var lines=["Выданные задания Тимофея",""];
    assignments.filter(function(a){return given[a.key];}).forEach(function(a){lines.push(a.date+" · "+a.section+" · "+a.label+" · "+new Date(given[a.key]).toLocaleString("ru-RU"));});
    if(lines.length===2)lines.push("Пока нет отмеченных заданий.");
    var blob=new Blob([lines.join("\\n")],{type:"text/plain;charset=utf-8"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="timofey-issued-homework.txt";a.click();setTimeout(function(){URL.revokeObjectURL(url);},1000);
  });
  var T="../timofey-oge/?from=hw&v=20261112b#";
  var P="../timofey-homework/oge-practice.html?v=20261112b#";

  /* ---- what Timofey has done: read from this device ---- */
  function read(k){try{return JSON.parse(localStorage.getItem(k)||"null")||null;}catch(e){return null;}}
  var S=read("timofey-oge.v2")||{res:{}};S.res=S.res||{};S.sent=S.sent||{};
  var PR=read("timofey.oge.practice.2026-11-09")||{};
  var PRS=(read("timofey.oge.practice.2026-11-09.sent")||{}).ids||[];

  /* Работы, которые уже пришли Татьяне во «Входящие» (сверено 12.11.2026). Пополнять при следующей сверке. */
  var RECEIVED=["tf:1","tf:2","tf:3","tf:4","tf:5","tf:6","mt:1","mt:2","mt:3","mt:4","mt:5","mt:6","gr:1","gr:2","gr:3","gr:4","wf:1","wf:2","wf:3"];

  var DATA={tf:OGE.TF,mt:OGE.MATCH,gr:OGE.GR,wf:OGE.WF,s1:OGE.SP1,s2:OGE.SP2,s3:OGE.SP3,wr:OGE.WR};
  function size(id,n){
    var it=(DATA[id]||[]).filter(function(x){return x.n===n;})[0];if(!it)return 1;
    if(id==="tf")return it.stmts.length;if(id==="mt")return it.texts.length;
    if(id==="gr"||id==="wf")return it.items.length;if(id==="s2")return it.qa.length;return 1;
  }
  function filled(a){return (a||[]).filter(function(v){return v!=null&&v!=="";}).length;}
  /* trainer item: "sent" / "done" / "" */
  function trainer(id,n){
    var k=id+":"+n;if(RECEIVED.indexOf(k)>=0)return "sent";var r=S.res[k];if(!r)return "";
    if(S.sent[k]||r.sent)return "sent";
    var stepper=/^(tf|mt|gr|wf)$/.test(id);
    if(stepper?filled(r.a)>=size(id,n):id==="s2"?filled(r.a)>=size(id,n):r.done)return "done";
    return "";
  }
  function words(t){return ((t||"").match(/[A-Za-z0-9'’-]+/g)||[]).length;}
  function practiceLetter(i){
    if(PRS.indexOf("letter"+i)>=0)return "sent";
    return words(PR["letter"+i])>=50?"done":"";
  }
  function practiceReading(s){
    var pre=s===0?"r":"r"+(s+1)+"_",n=0,sent=false;
    for(var i=0;i<8;i++){if(PR[pre+i])n++;if(PRS.indexOf(pre+i)>=0)sent=true;}
    return sent?"sent":n>=8?"done":"";
  }
    /* ---- homework by date (newest first) ---- */
  function items(n){
    return [
      ["Reading",[["T/F","tf",n],["Matching","mt",n]]],
      ["Grammar",[["Task","gr",n]]],
      ["Word formation",[["Task","wf",n]]],
      ["Writing",[["Email","wr",n]]],
      ["Speaking",[["Aloud","s1",n],["Interview","s2",n],["Talk","s3",n]]]
    ];
  }
  function trainerRows(ns){
    return items(0).map(function(row){
      var chips=[];
      row[1].forEach(function(c){ns.forEach(function(n){
        chips.push({label:c[0]+" "+String(n).padStart(2,"0"),href:T+c[1]+"/"+n,st:trainer(c[1],n)});
      });});
      return [row[0],chips];
    });
  }
  var DAYS=[
    {date:"9 November",rows:[
      ["Writing",[0,1,2].map(function(i){return {label:"Email "+(i+1),href:P+i,st:practiceLetter(i)};})],
      ["Reading",[0,1,2,3].map(function(i){return {label:"Text "+(i+1),href:P+(i+3),st:practiceReading(i)};})],
      ["Speaking",[["Reading aloud","s1"],["Interview","s2"],["Talk","s3"]].map(function(c){return {label:c[0],href:T+c[1],st:null};})]
    ]},
    {date:"17 October",one:true,rows:trainerRows([4,5,6])},
    {date:"8 October",one:true,rows:trainerRows([3]).concat([["Book 2026",[{label:"Variant 3",href:T+"bks/3",st:trainer("bks",3)}]]])}
  ];

  DAYS.forEach(function(d){
    var day=document.createElement("article");day.className="day";
    var all=0,ok=0;
    var rows=document.createElement("div");rows.className="rows"+(d.one?" one":"");
    d.rows.forEach(function(r){
      var row=document.createElement("div");row.className="r";
      var lab=document.createElement("div");lab.className="lab";lab.textContent=r[0];
      var chips=document.createElement("div");chips.className="chips";
      r[1].forEach(function(c){
        var a=document.createElement("a");a.href=c.href;a.className="chip"+(c.st?" "+c.st:"");
        a.textContent=c.label;
        if(c.st){var i=document.createElement("i");i.textContent=c.st==="sent"?"sent ✓":"done ✓";a.appendChild(i);}
        if(c.st!==null){all++;if(c.st)ok++;}
        if(teacher){
          var key=d.date+"|"+r[0]+"|"+c.label;
          assignments.push({key:key,date:d.date,section:r[0],label:c.label});
          var pair=document.createElement("span");pair.className="given-pair";
          var mark=document.createElement("button");mark.type="button";mark.className="given-mark"+(given[key]?" active":"");
          mark.textContent=given[key]?"Выдано ✓":"Выдать";mark.setAttribute("aria-pressed",String(!!given[key]));
          mark.setAttribute("aria-label",c.label+" — "+(given[key]?"выдано":"отметить выданным"));
          mark.addEventListener("click",function(){markGiven(key,!given[key],mark);});
          pair.append(a,mark);chips.appendChild(pair);
        }else chips.appendChild(a);
      });
      row.append(lab,chips);rows.appendChild(row);
    });
    var h=document.createElement("div");h.className="day-h";
    var h2=document.createElement("h2");h2.textContent=d.date;
    var cnt=document.createElement("div");cnt.className="cnt"+(ok===all?" all":"");cnt.textContent=ok===all?"all done ✓":ok+" / "+all+" done";
    h.append(h2,cnt);day.append(h,rows);
    var expanded=d===DAYS[0];
    if(!expanded)day.classList.add("collapsed");
    h.setAttribute("role","button");h.setAttribute("tabindex","0");h.setAttribute("aria-expanded",String(expanded));
    h.setAttribute("aria-label",d.date+" — "+cnt.textContent+"; expand or collapse");
    function toggle(){var isCollapsed=day.classList.toggle("collapsed");h.setAttribute("aria-expanded",String(!isCollapsed));}
    h.addEventListener("click",toggle);
    h.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});
    $("list").appendChild(day);
  });
  updateTeacherSummary();
})();
</script>
</body>
</html>
